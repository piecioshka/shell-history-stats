<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="shell-history-stats logo">
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="#231f1c"/>

  <!-- Shell prompt: the history comes from a terminal -->
  <g stroke="#e0825a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M28 30 L47 46 L28 62"/>
    <line x1="58" y1="62" x2="86" y2="62"/>
  </g>

  <!-- Usage ranking: a few commands dominate, the rest trail off -->
  <g fill="#f0e6da">
    <rect x="26" y="90" width="14" height="14" rx="3"/>
  </g>
  <rect x="45" y="78" width="14" height="26" rx="3" fill="#e0825a"/>
  <g fill="#f0e6da">
    <rect x="64" y="84" width="14" height="20" rx="3"/>
    <rect x="83" y="92" width="14" height="12" rx="3"/>
  </g>
</svg>
